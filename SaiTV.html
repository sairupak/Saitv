<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseIPTV - Modern Web Player</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HLS.js for HLS Stream Support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
            dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569' }
          }
        }
      }
    };
  </script>
  <style>
    /* Custom Scrollbar for channel lists */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased overflow-x-hidden">

  <!-- TOP HEADER -->
  <header class="bg-dark-800 border-b border-dark-700 sticky top-0 z-40 px-4 py-3 flex flex-wrap items-center justify-between gap-3 shadow-md">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 bg-brand-600 rounded-lg flex items-center justify-center font-bold text-lg text-white shadow-lg shadow-brand-500/30">
        ▶
      </div>
      <div>
        <h1 class="text-base font-bold leading-tight tracking-wide text-white">Pulse<span class="text-brand-500">IPTV</span></h1>
        <p class="text-xs text-slate-400" id="playlistStats">Loading playlist...</p>
      </div>
    </div>

    <!-- Playlist Selector / Custom URL -->
    <div class="flex items-center gap-2 flex-grow max-w-xl">
      <select id="presetSelect" class="bg-dark-700 text-xs text-slate-200 rounded-lg px-2.5 py-2 border border-dark-600 focus:outline-none focus:border-brand-500">
        <option value="https://iptv-org.github.io/iptv/index.m3u">All Channels (Global Index)</option>
        <option value="https://iptv-org.github.io/iptv/categories/news.m3u">News Channels</option>
        <option value="https://iptv-org.github.io/iptv/categories/movies.m3u">Movies Channels</option>
        <option value="https://iptv-org.github.io/iptv/countries/us.m3u">United States</option>
        <option value="https://iptv-org.github.io/iptv/countries/uk.m3u">United Kingdom</option>
        <option value="custom">Custom M3U URL...</option>
      </select>
      <input type="text" id="customUrlInput" placeholder="Enter .m3u / .m3u8 URL..." class="hidden flex-grow bg-dark-700 text-xs rounded-lg px-3 py-2 border border-dark-600 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500" />
      <button id="loadBtn" class="bg-brand-600 hover:bg-brand-500 text-white text-xs px-3 py-2 rounded-lg font-medium transition duration-150">Load</button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 max-w-[1800px] w-full mx-auto">
    
    <!-- LEFT PANEL: Video Player & Stream Details (7 cols) -->
    <section class="lg:col-span-7 flex flex-col gap-3">
      <!-- Player Wrapper (16:9 responsive) -->
      <div class="relative bg-black rounded-xl overflow-hidden shadow-2xl border border-dark-700 aspect-video flex items-center justify-center group">
        <video id="videoPlayer" class="w-full h-full object-contain" playsinline controls></video>
        
        <!-- Loading Overlay -->
        <div id="playerLoading" class="hidden absolute inset-0 bg-black/70 flex flex-col items-center justify-center gap-3 backdrop-blur-sm z-10">
          <div class="w-10 h-10 border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-xs font-medium text-slate-300 tracking-wider">CONNECTING STREAM...</p>
        </div>

        <!-- Error Overlay -->
        <div id="playerError" class="hidden absolute inset-0 bg-dark-900/90 flex flex-col items-center justify-center p-6 text-center z-20">
          <svg class="w-12 h-12 text-rose-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <p class="text-sm font-semibold text-slate-100" id="errorMessage">Playback Error</p>
          <p class="text-xs text-slate-400 mt-1 max-w-sm">The stream might be offline, geo-blocked, or restricted by browser CORS security policy.</p>
          <button id="retryBtn" class="mt-4 px-4 py-1.5 bg-dark-700 hover:bg-dark-600 rounded text-xs font-medium border border-dark-600">Retry Channel</button>
        </div>
      </div>

      <!-- Active Channel Info Bar -->
      <div class="bg-dark-800 border border-dark-700 p-4 rounded-xl flex items-center justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
          <div id="channelLogoContainer" class="w-12 h-12 rounded-lg bg-dark-700 border border-dark-600 flex items-center justify-center overflow-hidden flex-shrink-0">
            <span class="text-lg font-bold text-slate-400" id="channelLogoFallback"></span>
            <img id="channelLogo" class="w-full h-full object-contain hidden" alt="Logo" />
          </div>
          <div class="min-w-0">
            <h2 id="channelTitle" class="text-base font-bold truncate text-white">Select a channel to start</h2>
            <div class="flex items-center gap-2 mt-0.5">
              <span id="channelCategory" class="text-[11px] bg-dark-700 text-slate-300 px-2 py-0.5 rounded border border-dark-600">General</span>
              <span id="streamResolution" class="text-[11px] text-brand-500 font-semibold uppercase">Auto HLS</span>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="toggleFavoriteBtn" class="p-2.5 rounded-lg bg-dark-700 border border-dark-600 hover:bg-dark-600 text-slate-300 hover:text-amber-400 transition" title="Toggle Favorite">
            ★
          </button>
        </div>
      </div>
    </section>

    <!-- RIGHT PANEL: Channel Browser & Filtering (5 cols) -->
    <section class="lg:col-span-5 bg-dark-800 border border-dark-700 rounded-xl flex flex-col h-[650px] lg:h-[calc(100vh-6rem)] overflow-hidden">
      <!-- Search and Filter Bar -->
      <div class="p-3 border-b border-dark-700 flex flex-col gap-2.5 bg-dark-800">
        <div class="relative">
          <input type="text" id="searchInput" placeholder="Search channels..." class="w-full bg-dark-900 border border-dark-700 text-xs rounded-lg pl-8 pr-3 py-2 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500" />
          <svg class="w-4 h-4 text-slate-500 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <!-- Filter Tabs -->
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs" id="filterTabs">
          <button data-filter="all" class="filter-tab active bg-brand-600 text-white px-3 py-1 rounded-md font-medium whitespace-nowrap">All</button>
          <button data-filter="favorites" class="filter-tab bg-dark-700 text-slate-300 hover:bg-dark-600 px-3 py-1 rounded-md whitespace-nowrap">⭐ Favorites (<span id="favCount">0</span>)</button>
          <button data-filter="recent" class="filter-tab bg-dark-700 text-slate-300 hover:bg-dark-600 px-3 py-1 rounded-md whitespace-nowrap"> Recents</button>
        </div>

        <!-- Category Dropdown Filter -->
        <select id="categorySelect" class="bg-dark-900 border border-dark-700 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-brand-500">
          <option value="all">All Categories</option>
        </select>
      </div>

      <!-- Channel List (Virtualized / Paginated Chunking) -->
      <div id="channelList" class="flex-1 overflow-y-auto p-2 space-y-1">
        <!-- Rendered items go here -->
      </div>

      <!-- List Footer: Pagination Info -->
      <div class="p-2 border-t border-dark-700 bg-dark-800/80 flex items-center justify-between text-xs text-slate-400 px-3">
        <span id="renderedCount">Showing 0 channels</span>
        <button id="loadMoreBtn" class="hidden text-brand-500 hover:underline font-medium">Load more...</button>
      </div>
    </section>

  </main>

  <!-- APPLICATION LOGIC -->
  <script>
    /**
     * PulseIPTV Core Application
     */
    class IPTVApp {
      constructor() {
        this.channels = [];
        this.filteredChannels = [];
        this.activeFilter = 'all';
        this.activeCategory = 'all';
        this.searchQuery = '';
        this.currentChannel = null;
        
        // Pagination state
        this.pageSize = 50;
        this.currentPage = 1;

        // Local Storage
        this.favorites = new Set(JSON.parse(localStorage.getItem('pulse_favs') || '[]'));
        this.recents = JSON.parse(localStorage.getItem('pulse_recents') || '[]');

        // Player instance
        this.hls = null;
        this.video = document.getElementById('videoPlayer');

        this.initDOM();
        this.initEvents();
        this.loadPlaylist(document.getElementById('presetSelect').value);
      }

      initDOM() {
        this.dom = {
          presetSelect: document.getElementById('presetSelect'),
          customUrlInput: document.getElementById('customUrlInput'),
          loadBtn: document.getElementById('loadBtn'),
          stats: document.getElementById('playlistStats'),
          channelList: document.getElementById('channelList'),
          renderedCount: document.getElementById('renderedCount'),
          loadMoreBtn: document.getElementById('loadMoreBtn'),
          searchInput: document.getElementById('searchInput'),
          categorySelect: document.getElementById('categorySelect'),
          filterTabs: document.querySelectorAll('.filter-tab'),
          favCount: document.getElementById('favCount'),
          playerLoading: document.getElementById('playerLoading'),
          playerError: document.getElementById('playerError'),
          errorMessage: document.getElementById('errorMessage'),
          retryBtn: document.getElementById('retryBtn'),
          channelTitle: document.getElementById('channelTitle'),
          channelCategory: document.getElementById('channelCategory'),
          channelLogo: document.getElementById('channelLogo'),
          channelLogoFallback: document.getElementById('channelLogoFallback'),
          toggleFavoriteBtn: document.getElementById('toggleFavoriteBtn')
        };
        this.updateFavCountBadge();
      }

      initEvents() {
        // Preset selector change
        this.dom.presetSelect.addEventListener('change', (e) => {
          if (e.target.value === 'custom') {
            this.dom.customUrlInput.classList.remove('hidden');
          } else {
            this.dom.customUrlInput.classList.add('hidden');
          }
        });

        // Load button
        this.dom.loadBtn.addEventListener('click', () => {
          const val = this.dom.presetSelect.value;
          const url = val === 'custom' ? this.dom.customUrlInput.value.trim() : val;
          if (url) this.loadPlaylist(url);
        });

        // Search with debounce
        let searchTimeout;
        this.dom.searchInput.addEventListener('input', (e) => {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(() => {
            this.searchQuery = e.target.value.toLowerCase().trim();
            this.applyFilters();
          }, 200);
        });

        // Category dropdown change
        this.dom.categorySelect.addEventListener('change', (e) => {
          this.activeCategory = e.target.value;
          this.applyFilters();
        });

        // Tabs
        this.dom.filterTabs.forEach(tab => {
          tab.addEventListener('click', (e) => {
            this.dom.filterTabs.forEach(t => {
              t.classList.remove('bg-brand-600', 'text-white');
              t.classList.add('bg-dark-700', 'text-slate-300');
            });
            const target = e.currentTarget;
            target.classList.add('bg-brand-600', 'text-white');
            target.classList.remove('bg-dark-700', 'text-slate-300');
            this.activeFilter = target.dataset.filter;
            this.applyFilters();
          });
        });

        // Load more pagination
        this.dom.loadMoreBtn.addEventListener('click', () => {
          this.currentPage++;
          this.renderChannelList(true);
        });

        // Infinite scroll in list
        this.dom.channelList.addEventListener('scroll', () => {
          if (this.dom.channelList.scrollTop + this.dom.channelList.clientHeight >= this.dom.channelList.scrollHeight - 60) {
            if ((this.currentPage * this.pageSize) < this.filteredChannels.length) {
              this.currentPage++;
              this.renderChannelList(true);
            }
          }
        });

        // Video Player State Events
        this.video.addEventListener('waiting', () => this.setLoading(true));
        this.video.addEventListener('playing', () => {
          this.setLoading(false);
          this.dom.playerError.classList.add('hidden');
        });
        this.video.addEventListener('error', () => {
          this.setLoading(false);
          this.showError('Native Playback failed. Stream format or CORS not supported.');
        });

        this.dom.retryBtn.addEventListener('click', () => {
          if (this.currentChannel) this.playStream(this.currentChannel);
        });

        // Toggle Favorite active channel
        this.dom.toggleFavoriteBtn.addEventListener('click', () => {
          if (!this.currentChannel) return;
          this.toggleFavorite(this.currentChannel.url);
          this.updateFavoriteBtnState();
        });
      }

      /**
       * M3U Playlist Fetcher and High-Performance Parser
       */
      async loadPlaylist(url) {
        try {
          this.dom.stats.textContent = 'Downloading M3U playlist...';
          this.dom.channelList.innerHTML = `<div class="p-4 text-center text-xs text-slate-500 animate-pulse">Fetching playlist metadata...</div>`;

          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
          const text = await response.text();

          this.dom.stats.textContent = 'Parsing channels...';
          this.channels = this.parseM3U(text);
          this.dom.stats.textContent = `${this.channels.length.toLocaleString()} channels loaded`;

          this.populateCategories();
          this.applyFilters();
        } catch (err) {
          console.error('Playlist load error:', err);
          this.dom.stats.textContent = 'Failed to load playlist';
          this.dom.channelList.innerHTML = `
            <div class="p-6 text-center text-xs text-rose-400">
              <p class="font-bold mb-1">Failed to load playlist</p>
              <p class="text-slate-500">${err.message}</p>
            </div>
          `;
        }
      }

      parseM3U(content) {
        const lines = content.split('\n');
        const channels = [];
        let current = null;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (line.startsWith('#EXTINF:')) {
            // Extract metadata tags
            const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
            const groupMatch = line.match(/group-title="([^"]*)"/i);
            const nameMatch = line.match(/,(.+)$/);

            current = {
              name: nameMatch ? nameMatch[1].trim() : 'Unknown Channel',
              logo: logoMatch ? logoMatch[1] : '',
              group: groupMatch && groupMatch[1].trim() ? groupMatch[1].trim() : 'General',
              url: ''
            };
          } else if (line && !line.startsWith('#') && current) {
            current.url = line;
            channels.push(current);
            current = null;
          }
        }
        return channels;
      }

      populateCategories() {
        const categories = new Set();
        this.channels.forEach(ch => categories.add(ch.group));
        
        const sorted = Array.from(categories).sort();
        this.dom.categorySelect.innerHTML = `<option value="all">All Categories (${sorted.length})</option>`;
        sorted.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          this.dom.categorySelect.appendChild(opt);
        });
      }

      applyFilters() {
        this.currentPage = 1;
        this.filteredChannels = this.channels.filter(ch => {
          // Category filter
          if (this.activeCategory !== 'all' && ch.group !== this.activeCategory) {
            return false;
          }
          // Tab filters
          if (this.activeFilter === 'favorites' && !this.favorites.has(ch.url)) {
            return false;
          }
          if (this.activeFilter === 'recent' && !this.recents.includes(ch.url)) {
            return false;
          }
          // Search query
          if (this.searchQuery && !ch.name.toLowerCase().includes(this.searchQuery)) {
            return false;
          }
          return true;
        });

        this.renderChannelList(false);
      }

      renderChannelList(append = false) {
        if (!append) {
          this.dom.channelList.innerHTML = '';
        }

        const startIndex = (this.currentPage - 1) * this.pageSize;
        const slice = this.filteredChannels.slice(startIndex, startIndex + this.pageSize);

        if (slice.length === 0 && !append) {
          this.dom.channelList.innerHTML = `
            <div class="p-8 text-center text-xs text-slate-500">
              No channels match your current filter.
            </div>
          `;
          this.dom.renderedCount.textContent = 'Showing 0 channels';
          this.dom.loadMoreBtn.classList.add('hidden');
          return;
        }

        const fragment = document.createDocumentFragment();
        slice.forEach(ch => {
          const isFav = this.favorites.has(ch.url);
          const isActive = this.currentChannel && this.currentChannel.url === ch.url;

          const item = document.createElement('div');
          item.className = `group flex items-center justify-between p-2 rounded-lg cursor-pointer border transition text-xs ${
            isActive 
              ? 'bg-brand-600/10 border-brand-500 text-white' 
              : 'bg-dark-800/50 hover:bg-dark-700/60 border-dark-700/50 text-slate-300'
          }`;

          item.innerHTML = `
            <div class="flex items-center gap-2.5 min-w-0 pointer-events-none">
              <div class="w-7 h-7 bg-dark-900 border border-dark-700 rounded flex items-center justify-center overflow-hidden flex-shrink-0">
                ${ch.logo 
                  ? `<img src="${ch.logo}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />` 
                  : ''}
                <span class="${ch.logo ? 'hidden' : 'block'} text-[10px] text-slate-500"></span>
              </div>
              <div class="min-w-0">
                <p class="font-medium truncate leading-tight">${ch.name}</p>
                <p class="text-[10px] text-slate-500 truncate mt-0.5">${ch.group}</p>
              </div>
            </div>
            <button class="fav-btn p-1.5 rounded hover:text-amber-400 ${isFav ? 'text-amber-400' : 'text-slate-600 opacity-0 group-hover:opacity-100'} transition" title="Favorite">
              ★
            </button>
          `;

          // Card Click -> Play
          item.addEventListener('click', (e) => {
            if (e.target.closest('.fav-btn')) {
              this.toggleFavorite(ch.url);
              this.applyFilters();
              return;
            }
            this.playStream(ch);
          });

          fragment.appendChild(item);
        });

        this.dom.channelList.appendChild(fragment);

        const currentTotal = Math.min(this.currentPage * this.pageSize, this.filteredChannels.length);
        this.dom.renderedCount.textContent = `Showing ${currentTotal} of ${this.filteredChannels.length.toLocaleString()}`;

        if (currentTotal < this.filteredChannels.length) {
          this.dom.loadMoreBtn.classList.remove('hidden');
        } else {
          this.dom.loadMoreBtn.classList.add('hidden');
        }
      }

      /**
       * Stream Playback Engine (HLS.js + Native fallback)
       */
      playStream(channel) {
        this.currentChannel = channel;
        this.updateActiveChannelMetadata(channel);
        this.saveRecent(channel.url);

        this.setLoading(true);
        this.dom.playerError.classList.add('hidden');

        // Destroy previous HLS instance if active
        if (this.hls) {
          this.hls.destroy();
          this.hls = null;
        }

        const streamUrl = channel.url;

        if (Hls.isSupported()) {
          this.hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            manifestLoadingTimeOut: 10000,
            manifestLoadingMaxRetry: 2
          });

          this.hls.loadSource(streamUrl);
          this.hls.attachMedia(this.video);

          this.hls.on(Hls.Events.MANIFEST_PARSED, () => {
            this.video.play().catch(e => {
              console.warn('Autoplay prevented:', e);
            });
          });

          this.hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  this.showError('Network Error: Stream is dead or blocked by CORS.');
                  this.hls.destroy();
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  this.hls.recoverMediaError();
                  break;
                default:
                  this.showError('Stream format not supported.');
                  this.hls.destroy();
                  break;
              }
            }
          });
        } 
        // iOS Safari Native HLS support
        else if (this.video.canPlayType('application/vnd.apple.mpegurl')) {
          this.video.src = streamUrl;
          this.video.addEventListener('loadedmetadata', () => {
            this.video.play().catch(e => console.warn('Autoplay blocked:', e));
          }, { once: true });
        } else {
          this.showError('HLS playback is not supported on this browser.');
        }

        // Re-highlight active channel in list
        this.renderChannelList(false);
      }

      updateActiveChannelMetadata(ch) {
        this.dom.channelTitle.textContent = ch.name;
        this.dom.channelCategory.textContent = ch.group;

        if (ch.logo) {
          this.dom.channelLogo.src = ch.logo;
          this.dom.channelLogo.classList.remove('hidden');
          this.dom.channelLogoFallback.classList.add('hidden');
          this.dom.channelLogo.onerror = () => {
            this.dom.channelLogo.classList.add('hidden');
            this.dom.channelLogoFallback.classList.remove('hidden');
          };
        } else {
          this.dom.channelLogo.classList.add('hidden');
          this.dom.channelLogoFallback.classList.remove('hidden');
        }
        this.updateFavoriteBtnState();
      }

      setLoading(loading) {
        if (loading) {
          this.dom.playerLoading.classList.remove('hidden');
        } else {
          this.dom.playerLoading.classList.add('hidden');
        }
      }

      showError(msg) {
        this.setLoading(false);
        this.dom.errorMessage.textContent = msg;
        this.dom.playerError.classList.remove('hidden');
      }

      toggleFavorite(url) {
        if (this.favorites.has(url)) {
          this.favorites.delete(url);
        } else {
          this.favorites.add(url);
        }
        localStorage.setItem('pulse_favs', JSON.stringify(Array.from(this.favorites)));
        this.updateFavCountBadge();
        this.updateFavoriteBtnState();
      }

      updateFavoriteBtnState() {
        if (!this.currentChannel) return;
        const isFav = this.favorites.has(this.currentChannel.url);
        this.dom.toggleFavoriteBtn.innerHTML = isFav ? '★' : '☆';
        this.dom.toggleFavoriteBtn.className = isFav 
          ? 'p-2.5 rounded-lg bg-dark-700 border border-dark-600 text-amber-400 transition'
          : 'p-2.5 rounded-lg bg-dark-700 border border-dark-600 text-slate-400 hover:text-white transition';
      }

      updateFavCountBadge() {
        this.dom.favCount.textContent = this.favorites.size;
      }

      saveRecent(url) {
        this.recents = this.recents.filter(u => u !== url);
        this.recents.unshift(url);
        if (this.recents.length > 30) this.recents.pop();
        localStorage.setItem('pulse_recents', JSON.stringify(this.recents));
      }
    }

    // Initialize application on DOM ready
    document.addEventListener('DOMContentLoaded', () => {
      window.app = new IPTVApp();
    });
  </script>
</body>
</html>
